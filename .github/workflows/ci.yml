name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The classifiers promise 3.11-3.14 on Linux and Windows; this is what keeps that true.
    # Windows matters here in particular: line endings, path spelling and process trees
    # all behave differently, and each has been a bug.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-groups --python ${{ matrix.python }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # No model, no GPU, no network: everything under test is the code that decides
      # whether a survivor is a gap.
      - name: Test
        run: uv run pytest -q

      - name: Demo (audits the bundled example project)
        run: uv run python demo.py

      - name: Audit its own suite
        # Dogfooding. Never fails the build on a finding - the point is that the numbers
        # are visible, and this tool's own coverage gaps are as interesting as anyone's.
        run: uv run suite-auditor coverage . || true

  wheel:
    # The editable install reads src/ directly. Build the real wheel, install it where
    # src/ is not, and run the suite and the console script against that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest
      - run: python -m build --wheel
      - run: pip install dist/*.whl
      - run: suite-auditor --version && python -m suite_auditor --version
      - run: |
          mkdir /tmp/installed && cp -r tests /tmp/installed/
          cd /tmp/installed && python -m pytest -q -p no:cacheprovider tests
