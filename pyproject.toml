[project]
name = "suite-auditor"
version = "0.1.0"
description = "Mutation-test a pytest suite and report only the gaps it can prove, with the call that proves each one"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # Listed one by one so PyPI can show what is supported. Every version
    # here is exercised by CI on Linux and Windows.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
readme = "README.md"
authors = [{ name = "hammasbuilds" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mutation-testing", "test-quality", "differential-testing", "coverage", "pytest", "test-adequacy"]
# No runtime dependencies. Coverage is ~40 lines of sys.settrace rather than coverage.py,
# because a tool whose output is a claim about somebody else's tests should be a smaller
# thing to trust than the tests it audits.
dependencies = []

# Both, deliberately. `uv sync` reads the dependency group; `pip install -e ".[dev]"`
# reads the extra and only warns if it is missing (or, on pip < 25.1, no-ops silently),
# so a generic "how do I install for development" step installed nothing without this.
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17", "pytest-cov>=5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17", "pytest-cov>=5"]

[project.scripts]
suite-auditor = "suite_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/suite-auditor"
Source = "https://github.com/hammasbuilds/suite-auditor"
Issues = "https://github.com/hammasbuilds/suite-auditor/issues"
Changelog = "https://github.com/hammasbuilds/suite-auditor/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suite_auditor"]
# py.typed is empty and has no extension, which is exactly the sort of file
# a build backend drops. Without it in the wheel, mypy and pyright ignore
# every annotation in this package and hand callers `Any` - PEP 561 needs
# the marker shipped, not just the hints written.
artifacts = ["src/suite_auditor/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# examples/pricing is linted with the rest of the repo; its package is first-party there.
known-first-party = ["suite_auditor", "pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
